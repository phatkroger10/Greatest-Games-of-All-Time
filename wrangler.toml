# Cloudflare Worker that serves the static site in ./site (no build step, no server code).
name = "greatest-games-of-all-time"
compatibility_date = "2026-10-01"

[assets]
directory = "./site"
not_found_handling = "404-page"

# Lets Cloudflare build preview versions of non-production branches (`wrangler preview`).
# Empty on purpose: previews reuse the settings above.
[previews]
